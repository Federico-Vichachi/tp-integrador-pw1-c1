<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/estilo-recuperar-password.css">
   <title>Recuperar Contraseña</title>
</head>

<body>
   <form>
      <h1 id="titulo-recuperar">¿Olvidaste tu contraseña?</h1>

      <p>Ingresá el mail con el que te registraste y te enviaremos los pasos a 
         seguir para generar una nueva contraseña
      </p>

      <div class="input-box">
         <input type="email" name="email" placeholder="Email">
      </div>

      <button id="boton-recuperar" type="submit">
        Continuar
      </button>

      <p>Al continuar, confirmo que he leído y aceptado los <a href="#">Términos y
         Condiciones</a> y las <a href="#">Políticas de Privacidad</a>
      </p>

   </form>
</body>

</html>
