<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/estilo-recuperar-password.css" />
    <title>Recuperar contraseña</title>
  </head>
  <body>
    <form action="">
      <h1 id="titulo">¿Olvidaste tu Contraseña?</h1>
      <p>
        Ingresa el email con el que te registraste y te enviaremos los pasos a
        seguir para generar una nueva contraseña
      </p>
      <div class="input-box">
        <input
          type="email"
          name="email"
          placeholder="Ingrese su Email"
          required
        />
      </div>
      <button id="boton">Continuar</button>
    </form>
  </body>
</html>
