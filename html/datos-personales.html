﻿<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/estilo-datos-personales.css" />
    <link rel="stylesheet" href="/css/temas-colores-fuentes.css" />
    <title>Datos Personales</title>
  </head>
  <body id="cuerpo" class="light-theme">
    <form id="formMiUsuario">
      <h1 id="titulo">Mi Usuario</h1>

      <div class="input-box">
        <label class="etiqueta" for="nombre">Ingrese su Nuevo Email</label>

        <input name="email" placeholder="Ingrese nuevo Email" />
      </div>
      <div class="input-box">
        <label class="etiqueta" for="contraseña"
          >Ingrese su nueva Contraseña</label
        >

        <input type="password" name="password" placeholder="mas de 4 digitos" />
      </div>
      <button type="submit" id="boton">Guardar cambios</button>
      <div id="mensajeValidacionUsuario" class="error"></div>
    </form>
    <form id="formDatos">
      <h1 id="titulo">Mis Datos Personales</h1>

      <div class="input-box">
        <label class="etiqueta" for="nombre">Nombre</label>
        <input type="text" name="nombre" placeholder="Ingrese su Nombre" />
      </div>
      <div class="input-box">
        <label for="apellido" class="etiqueta">Apellido</label>
        <input type="text" name="apellido" placeholder="Ingrese su Apellido" />
      </div>
      <div class="input-select">
        <label for="tipo" class="etiqueta">Tipo De Documento</label>
        <select class="select" name="Tipo de Documento">
          <option value="DNI">DNI</option>
          <option value="LE">LE</option>
          <option value="LC">LC</option>
          <option value="CI">CI</option>
        </select>
      </div>
      <div class="input-box">
        <label for="nro-de-documento" class="etiqueta"
          >Numero de Documento</label
        >
        <input
          type="number"
          name="nro-de-documento"
          placeholder="Ingrese su Numero de Documento"
        />
      </div>
      <div class="input-box">
        <label for="fecha" class="etiqueta">Fecha de nacimiento</label>
        <input type="date" id="fecha" name="fecha" />
      </div>
      <div class="input-box">
        <label for="nro-de-celular" class="etiqueta">Numero de Celular</label>
        <input
          type="number"
          name="nro-de-celular"
          placeholder="Ingrese su Numero de celular"
        />
      </div>
      <div class="input-box">
        <label class="etiqueta" for="nombre">Email Secundario</label>

        <input
          type="email"
          name="email-secundario"
          placeholder="Ingrese su Email Secundario"
        />
      </div>
      <button type="submit" id="boton">Guardar Cambios</button>
      <div id="mensajeValidacionDatos" class="error"></div>
    </form>
    <script src="/js/cambiar-modo/cambiar-modo-formulario.js"></script>
    <script src="../js/validaciones/datos-personales.js"></script>
  </body>
</html>
