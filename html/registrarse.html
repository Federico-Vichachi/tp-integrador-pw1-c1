<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/estilo-registrarse.css" />
    <link rel="stylesheet" href="/css/temas-colores-fuentes.css" />
    <title>Registrarse</title>
  </head>

  <body id="cuerpo" class="light-theme">
    <form>
      <h1 id="titulo-registrarse">Registrarse</h1>

      <div class="input-box">
        <input name="email" placeholder="Email" />
      </div>

      <div class="input-box">
        <input type="password" name="password" placeholder="Contraseña" />
      </div>

      <button id="boton-registrarse" type="submit">Registrate</button>

      <div id="mensajeValidacion" class="error"></div>

      <h5 id="tengo-una-cuenta">
        ¿Ya tienes una cuenta?
        <a href="login.html">
          <strong> Iniciar sesión </strong>
        </a>
      </h5>
    </form>
    <script src="/js/cambiar-modo/cambiar-modo-formulario.js"></script>
    <script src="../js/validaciones/registrarse.js"></script>
  </body>
</html>
