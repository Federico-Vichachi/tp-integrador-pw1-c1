<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/estilo-login.css">
   <title>Iniciar Sesión</title>
</head>

<body>
   <form>
      <h1 id="titulo-login">Iniciar Sesión</h1>

      <div class="input-box">
         <input type="email" name="email" placeholder="Email">
      </div>

      <div class="input-box">
         <input type="password" name="password" placeholder="Contraseña">
      </div>

      <div class="recuerdame">
         <input type="checkbox" name="recuerdame" id="recuerdame">
         <label for="recuerdame">Mantener sesión iniciada</label>
      </div>

      <button id="boton-login" type="submit">
        Iniciar Sesión
      </button>

      <a id="olvide" href="recuperar-password.html">
         <strong>Olvidé mi Contraseña</strong>
      </a>

      <h5 id="no-tengo-una-cuenta">
         ¿No tienes una cuenta?
         <a href="registrarse.html">
            <strong>
               Registrarse
            </strong>
         </a>
      </h5>

   </form>
</body>

</html>
